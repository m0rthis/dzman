name: golangci-lint
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Built from source with the job's Go, since a prebuilt binary refuses to
          # lint a module whose go.mod targets a newer Go than it was built with.
          install-mode: goinstall
          version: v2.15.0
