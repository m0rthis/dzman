name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: build & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          REFERENCE: ${{ github.ref }}
        run: |
          set -euo pipefail
          PKG=github.com/m0rthis/dzman/internal/version
          REV=$(git rev-parse --short=12 HEAD)
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X ${PKG}.Version=${VERSION} \
            -X ${PKG}.Revision=${REV} \
            -X ${PKG}.Reference=${REFERENCE} \
            -X ${PKG}.BuiltAt=${BUILT}"

          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            name="dzman_${VERSION}_${GOOS}_${GOARCH}"
            echo "building ${name}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/${name}/dzman" ./cmd
            cp README.md "dist/${name}/" 2>/dev/null || true
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          done
          ( cd dist && sha256sum *.tar.gz > checksums.txt )

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "dist/*.tar.gz,dist/checksums.txt"
          generateReleaseNotes: true
          draft: false
          prerelease: false
